name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # Branch protection requires this job by name, so auto-merge of Dependabot
  # PRs waits for it. Renaming it means updating the protection rule too.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run lint

      - run: npx prettier --check bin/onedrive
